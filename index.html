<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>热梗工作台 · 多闪创意情报中心</title>
<style>
/* ========== Design Tokens ========== */
:root {
  --bg-deep: #070b19;
  --bg-base: #0a0f24;
  --bg-surface: rgba(14, 19, 42, 0.85);
  --bg-surface-solid: #0e132a;
  --bg-card: rgba(18, 24, 48, 0.7);
  --bg-card-hover: rgba(22, 29, 56, 0.85);
  --bg-elevated: rgba(26, 33, 62, 0.8);

  --text-primary: #e8ecf4;
  --text-secondary: #8892b0;
  --text-muted: #4a5578;

  --accent-primary: #7c5cfc;
  --accent-glow: rgba(124, 92, 252, 0.3);
  --accent-cyan: #00d4ff;
  --accent-cyan-glow: rgba(0, 212, 255, 0.25);
  --gradient-accent: linear-gradient(135deg, #7c5cfc, #00d4ff);

  --border-subtle: rgba(124, 92, 252, 0.1);
  --border-medium: rgba(124, 92, 252, 0.18);
  --border-glow: rgba(124, 92, 252, 0.35);

  --success: #00d68f;
  --warning: #ffaa00;
  --danger: #ff3d71;

  --radius-sm: 6px;
  --radius: 10px;
  --radius-lg: 14px;
  --radius-xl: 18px;

  --font-sans: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
  --font-mono: 'SF Mono', 'Menlo', 'Consolas', 'Courier New', monospace;

  --transition: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
  --transition-slow: 0.4s cubic-bezier(0.4, 0, 0.2, 1);
}

/* ========== Reset & Base ========== */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 14px; }
body {
  font-family: var(--font-sans);
  background: var(--bg-deep);
  color: var(--text-primary);
  line-height: 1.6;
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
  background-image:
    linear-gradient(rgba(124, 92, 252, 0.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(124, 92, 252, 0.03) 1px, transparent 1px);
  background-size: 48px 48px;
  background-position: center center;
}

/* ========== Ambient glow orbs ========== */
body::before {
  content: '';
  position: fixed;
  top: -180px; left: -80px;
  width: 500px; height: 500px;
  background: radial-gradient(circle, rgba(124, 92, 252, 0.08), transparent 70%);
  pointer-events: none; z-index: 0;
}
body::after {
  content: '';
  position: fixed;
  bottom: -150px; right: -100px;
  width: 400px; height: 400px;
  background: radial-gradient(circle, rgba(0, 212, 255, 0.06), transparent 70%);
  pointer-events: none; z-index: 0;
}

/* ========== Layout ========== */
.app { max-width: 1440px; margin: 0 auto; padding: 28px 32px; position: relative; z-index: 1; }

/* ========== Header ========== */
.header {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 28px; flex-wrap: wrap; gap: 20px;
  padding: 20px 24px;
  background: var(--bg-card);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-lg);
}
.header-left { display: flex; align-items: center; gap: 18px; }
.logo {
  position: relative;
  width: 46px; height: 46px;
  background: var(--gradient-accent);
  border-radius: 12px;
  display: flex; align-items: center; justify-content: center;
  font-size: 20px;
  box-shadow: 0 0 24px var(--accent-glow);
  flex-shrink: 0;
}
.logo::after {
  content: '';
  position: absolute; inset: -2px;
  border-radius: 14px;
  background: var(--gradient-accent);
  opacity: 0.3; z-index: -1;
  animation: logoPulse 3s ease-in-out infinite;
}
@keyframes logoPulse {
  0%, 100% { opacity: 0.2; transform: scale(1); }
  50% { opacity: 0.45; transform: scale(1.04); }
}
.header-hgroup { display: flex; flex-direction: column; gap: 2px; }
.header-hgroup h1 {
  font-size: 1.25rem; font-weight: 600;
  background: var(--gradient-accent);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  background-clip: text;
  letter-spacing: 1px;
}
.header-hgroup p { font-size: 0.78rem; color: var(--text-secondary); font-weight: 400; letter-spacing: 0.5px; }
.header-right { display: flex; align-items: center; gap: 18px; }

.status-panel { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
.status-row { display: flex; align-items: center; gap: 8px; }
.live-dot {
  width: 7px; height: 7px;
  background: var(--success);
  border-radius: 50%;
  box-shadow: 0 0 8px rgba(0, 214, 143, 0.6);
  animation: dotPulse 2s ease-in-out infinite;
}
@keyframes dotPulse {
  0%, 100% { opacity: 1; box-shadow: 0 0 8px rgba(0, 214, 143, 0.6); }
  50% { opacity: 0.5; box-shadow: 0 0 4px rgba(0, 214, 143, 0.3); }
}
.signal-bars { display: flex; align-items: flex-end; gap: 2px; height: 14px; }
.signal-bars span { width: 3px; background: var(--accent-cyan); border-radius: 1px; }
.signal-bars span:nth-child(1) { height: 4px; opacity: 0.5; }
.signal-bars span:nth-child(2) { height: 8px; opacity: 0.7; }
.signal-bars span:nth-child(3) { height: 12px; opacity: 0.9; }
.signal-bars span:nth-child(4) { height: 14px; filter: drop-shadow(0 0 3px var(--accent-cyan-glow)); }
.status-date { font-family: var(--font-mono); font-size: 0.9rem; font-weight: 500; color: var(--text-primary); }
.status-time { font-family: var(--font-mono); font-size: 0.7rem; color: var(--text-secondary); letter-spacing: 0.5px; }

.refresh-btn {
  display: flex; align-items: center; gap: 7px;
  padding: 9px 18px;
  background: rgba(124, 92, 252, 0.12);
  border: 1px solid var(--border-medium);
  border-radius: var(--radius-sm);
  color: var(--accent-cyan);
  font-size: 0.82rem; font-weight: 500; font-family: var(--font-sans);
  cursor: pointer; transition: var(--transition);
  white-space: nowrap;
}
.refresh-btn:hover {
  background: rgba(124, 92, 252, 0.22);
  border-color: var(--border-glow);
  box-shadow: 0 0 16px rgba(124, 92, 252, 0.2);
  transform: translateY(-1px);
}
.refresh-btn:active { transform: translateY(0); }
.refresh-btn .btn-icon { font-size: 0.9rem; }
.refresh-btn.loading {
  pointer-events: none; opacity: 0.6;
}
.refresh-btn.loading .btn-icon {
  animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ========== Stats Bar ========== */
.stats-bar {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 16px;
  margin-bottom: 24px;
}
@media (max-width: 800px) { .stats-bar { grid-template-columns: repeat(2, 1fr); } }

.stat-card {
  position: relative;
  background: var(--bg-card);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-lg);
  padding: 20px 22px;
  transition: var(--transition-slow);
  overflow: hidden;
}
.stat-card::before {
  content: '';
  position: absolute; top: 0; left: -100%;
  width: 100%; height: 100%;
  background: linear-gradient(105deg, transparent 40%, rgba(124, 92, 252, 0.04), transparent 60%);
  transition: left 0.8s ease;
}
.stat-card:hover::before { left: 100%; }
.stat-card:hover { border-color: var(--border-medium); transform: translateY(-2px); }
.stat-card .stat-icon-wrap {
  width: 36px; height: 36px;
  border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  margin-bottom: 14px;
  font-size: 1rem;
  background: rgba(124, 92, 252, 0.1);
}
.stat-card .stat-value {
  font-family: var(--font-mono);
  font-size: 1.65rem; font-weight: 600;
  color: var(--text-primary);
  letter-spacing: -0.5px;
}
.stat-card .stat-label { font-size: 0.78rem; color: var(--text-secondary); margin-top: 4px; font-weight: 500; }
.stat-card .stat-extra { font-size: 0.7rem; color: var(--text-muted); margin-top: 3px; font-family: var(--font-mono); }

/* ========== Filter Bar ========== */
.filter-bar {
  background: var(--bg-card);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-lg);
  padding: 16px 22px;
  margin-bottom: 22px;
  display: flex; flex-direction: column; gap: 12px;
}
.filter-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.filter-label {
  font-size: 0.75rem; color: var(--text-muted); font-weight: 600;
  min-width: 40px; text-transform: uppercase; letter-spacing: 1.5px;
}
.filter-chip {
  padding: 5px 14px;
  border-radius: 16px;
  font-size: 0.76rem; font-weight: 500;
  cursor: pointer;
  border: 1px solid rgba(255,255,255,0.06);
  background: rgba(255,255,255,0.03);
  color: var(--text-secondary);
  transition: var(--transition);
  white-space: nowrap;
  font-family: var(--font-sans);
}
.filter-chip:hover { border-color: var(--border-medium); color: var(--text-primary); background: rgba(124,92,252,0.08); }
.filter-chip.active {
  background: rgba(124, 92, 252, 0.2);
  border-color: var(--border-glow);
  color: var(--accent-cyan);
  box-shadow: 0 0 12px rgba(124, 92, 252, 0.12);
}
.search-box {
  flex: 1; min-width: 180px;
  padding: 8px 16px;
  background: rgba(255,255,255,0.03);
  border: 1px solid rgba(255,255,255,0.06);
  border-radius: var(--radius-sm);
  font-size: 0.82rem; font-family: var(--font-sans);
  color: var(--text-primary);
  outline: none; transition: var(--transition);
}
.search-box::placeholder { color: var(--text-muted); }
.search-box:focus {
  border-color: var(--border-glow);
  box-shadow: 0 0 14px rgba(124, 92, 252, 0.1);
  background: rgba(255,255,255,0.05);
}
.sort-select {
  padding: 8px 14px;
  background: rgba(255,255,255,0.03);
  border: 1px solid rgba(255,255,255,0.06);
  border-radius: var(--radius-sm);
  font-size: 0.82rem; font-family: var(--font-sans);
  color: var(--text-primary);
  cursor: pointer; outline: none;
  transition: var(--transition);
}
.sort-select:focus { border-color: var(--border-glow); }
.sort-select option { background: var(--bg-surface-solid); color: var(--text-primary); }

/* ========== Main Content ========== */
.main-content { display: grid; grid-template-columns: 1fr 340px; gap: 22px; }
@media (max-width: 1100px) { .main-content { grid-template-columns: 1fr; } }

/* ========== Trend Grid ========== */
.trend-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(330px, 1fr));
  gap: 16px;
  align-content: start;
}
.trend-card {
  position: relative;
  background: var(--bg-card);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-lg);
  padding: 20px 22px;
  transition: var(--transition-slow);
  overflow: hidden;
  cursor: pointer;
}
.trend-card::before {
  content: '';
  position: absolute; top: 0; left: 0;
  width: 100%; height: 1px;
  background: var(--gradient-accent);
  opacity: 0;
  transition: opacity 0.3s ease;
}
.trend-card:hover::before { opacity: 0.4; }
.trend-card:hover {
  border-color: var(--border-medium);
  transform: translateY(-3px);
  box-shadow: 0 8px 32px rgba(124, 92, 252, 0.1), 0 0 60px rgba(0, 212, 255, 0.04);
}
.trend-card::after {
  content: '';
  position: absolute; top: 0; left: 0;
  width: 3px; height: 100%;
  background: var(--card-accent, var(--accent-primary));
  border-radius: 0 2px 2px 0;
}

.card-header { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 12px; padding-left: 8px; }
.rank-badge {
  display: flex; align-items: center; justify-content: center;
  width: 30px; height: 30px;
  border-radius: 7px;
  font-family: var(--font-mono);
  font-weight: 600; font-size: 0.82rem;
  flex-shrink: 0;
}
.rank-badge.r1 { background: linear-gradient(135deg, #ffd700, #ffb800); color: #1a1a00; box-shadow: 0 0 12px rgba(255,215,0,0.3); }
.rank-badge.r2 { background: linear-gradient(135deg, #c0c0c0, #a0a0a0); color: #1a1a1a; box-shadow: 0 0 8px rgba(192,192,192,0.2); }
.rank-badge.r3 { background: linear-gradient(135deg, #cd7f32, #b87333); color: #fff; box-shadow: 0 0 8px rgba(205,127,50,0.2); }
.rank-badge.rn { background: rgba(255,255,255,0.04); color: var(--text-secondary); border: 1px solid rgba(255,255,255,0.06); }

.card-platform {
  display: flex; align-items: center; gap: 5px;
  font-size: 0.7rem; font-weight: 600;
  padding: 3px 10px;
  border-radius: 10px;
  color: var(--card-accent, var(--accent-cyan));
  background: color-mix(in srgb, var(--card-accent, var(--accent-primary)) 12%, transparent);
  border: 1px solid color-mix(in srgb, var(--card-accent, var(--accent-primary)) 20%, transparent);
}
.card-title {
  font-size: 0.95rem; font-weight: 500;
  line-height: 1.55; margin-bottom: 10px;
  color: var(--text-primary);
  padding-left: 8px;
}
.card-meta { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; padding-left: 8px; flex-wrap: wrap; }
.card-category {
  font-size: 0.68rem; padding: 3px 9px;
  border-radius: 8px;
  background: rgba(255,255,255,0.03);
  color: var(--text-secondary);
  font-weight: 500;
  border: 1px solid rgba(255,255,255,0.04);
}
.card-hot {
  font-family: var(--font-mono);
  font-size: 0.72rem;
  color: var(--danger);
  font-weight: 500;
  display: flex; align-items: center; gap: 4px;
}

/* Score badge */
.card-score {
  display: inline-flex; align-items: center; gap: 4px;
  font-family: var(--font-mono);
  font-size: 0.72rem; font-weight: 600;
  padding: 2px 8px;
  border-radius: 10px;
  border: 1px solid;
}
.card-score.high {
  color: var(--accent-cyan);
  background: rgba(0,212,255,0.08);
  border-color: rgba(0,212,255,0.25);
  box-shadow: 0 0 8px rgba(0,212,255,0.12);
}
.card-score.mid {
  color: #ffaa00;
  background: rgba(255,170,0,0.08);
  border-color: rgba(255,170,0,0.2);
}
.card-score.low {
  color: var(--text-muted);
  background: rgba(255,255,255,0.03);
  border-color: rgba(255,255,255,0.06);
}

.card-idea {
  background: rgba(124, 92, 252, 0.06);
  border: 1px solid rgba(124, 92, 252, 0.12);
  border-radius: var(--radius-sm);
  padding: 12px 14px;
  font-size: 0.78rem; line-height: 1.65;
  color: #b4a8e8;
  margin-top: 6px;
  display: flex; gap: 8px; align-items: flex-start;
  transition: var(--transition);
}
.card-idea:hover { background: rgba(124, 92, 252, 0.1); border-color: rgba(124, 92, 252, 0.25); }
.card-idea .idea-dot { flex-shrink: 0; width: 6px; height: 6px; margin-top: 7px; border-radius: 50%; background: var(--accent-primary); }
.card-link {
  display: inline-flex; align-items: center; gap: 4px;
  font-size: 0.75rem; color: var(--accent-cyan); font-weight: 500;
  text-decoration: none; margin-top: 10px; padding-left: 8px;
  transition: var(--transition);
}
.card-link:hover { gap: 10px; text-decoration: underline; }

.fallback-tag {
  position: absolute; top: 8px; right: 8px;
  font-size: 0.62rem; padding: 2px 7px; border-radius: 4px;
  background: rgba(255,170,0,0.12);
  color: var(--warning);
  font-weight: 500; font-family: var(--font-mono);
  border: 1px solid rgba(255,170,0,0.2);
}

/* ========== Event Badges ========== */
.event-badge {
  font-size: 0.62rem; padding: 2px 8px; border-radius: 999px;
  font-weight: 500; white-space: nowrap;
  border: 1px solid transparent;
}
.event-badge.qixi { background: rgba(255,107,157,0.12); color: #ff6b9d; border-color: rgba(255,107,157,0.25); }
.event-badge.school { background: rgba(124,92,252,0.12); color: #a78bfa; border-color: rgba(124,92,252,0.25); }
.event-badge.koc { background: rgba(0,212,255,0.1); color: #00d4ff; border-color: rgba(0,212,255,0.2); }

/* ========== Brief Panel ========== */
.brief-panel {
  margin-top: 10px; padding: 14px;
  background: rgba(124, 92, 252, 0.04);
  border: 1px solid rgba(124, 92, 252, 0.12);
  border-radius: 10px;
  animation: briefIn 0.25s ease;
}
@keyframes briefIn { from { opacity: 0; max-height: 0; } to { opacity: 1; max-height: 400px; } }
.brief-row {
  font-size: 0.78rem; color: var(--text-secondary); line-height: 1.7;
  padding: 3px 0; border-bottom: 1px solid rgba(255,255,255,0.03);
}
.brief-row:last-child { border-bottom: none; }
.brief-label {
  display: inline-block; min-width: 72px;
  font-weight: 600; color: var(--text-primary);
  margin-right: 4px;
}
.brief-tags { color: var(--accent-cyan); font-size: 0.72rem; word-break: break-all; }

.card-expand-hint {
  font-size: 0.68rem; color: var(--text-tertiary);
  margin-top: 8px; text-align: center;
  opacity: 0.6; transition: var(--transition);
}
.card-expand-hint:hover { opacity: 1; color: var(--accent-primary); }
.trend-card.expanded .card-expand-hint::after { content: ' ▴'; }
.trend-card:not(.expanded) .card-expand-hint::after { content: ' ▾'; }

/* ========== Sidebar ========== */
.sidebar { display: flex; flex-direction: column; gap: 16px; }

.sidebar-card {
  background: var(--bg-card);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-lg);
  padding: 18px 20px;
  transition: var(--transition);
}
.sidebar-card:hover { border-color: var(--border-medium); }
.sidebar-title {
  font-size: 0.82rem; font-weight: 600;
  margin-bottom: 14px;
  display: flex; align-items: center; gap: 8px;
  color: var(--text-primary);
  letter-spacing: 0.3px;
}
.sidebar-title .t-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--accent-primary); box-shadow: 0 0 6px var(--accent-glow); }

.insight-item {
  padding: 11px 13px;
  border-radius: var(--radius-sm);
  background: rgba(255,255,255,0.02);
  margin-bottom: 7px;
  cursor: pointer;
  transition: var(--transition);
  border: 1px solid transparent;
}
.insight-item:hover { background: rgba(124,92,252,0.06); border-color: var(--border-medium); }
.insight-item:last-child { margin-bottom: 0; }
.insight-item .ir-score {
  font-family: var(--font-mono);
  font-size: 0.65rem; font-weight: 600;
  color: var(--accent-cyan);
  margin-bottom: 3px;
  display: inline-block;
  padding: 1px 6px;
  border-radius: 4px;
  background: rgba(0,212,255,0.08);
}
.insight-item .ir-title { font-weight: 500; color: var(--text-primary); font-size: 0.8rem; margin-bottom: 3px; }
.insight-item .ir-desc { color: var(--text-secondary); font-size: 0.73rem; line-height: 1.5; }

.platform-dist { display: flex; flex-direction: column; gap: 10px; }
.platform-bar { display: flex; align-items: center; gap: 8px; }
.platform-bar .pb-label { font-size: 0.73rem; font-weight: 500; color: var(--text-secondary); min-width: 50px; }
.platform-bar .pb-track { flex: 1; height: 5px; background: rgba(255,255,255,0.03); border-radius: 3px; overflow: hidden; }
.platform-bar .pb-fill { height: 100%; border-radius: 3px; transition: width 0.7s ease; position: relative; }
.platform-bar .pb-fill::after {
  content: '';
  position: absolute; top: 0; right: 0;
  width: 100%; height: 100%;
  background: inherit;
  filter: blur(3px); opacity: 0.4;
}
.platform-bar .pb-count {
  font-family: var(--font-mono);
  font-size: 0.7rem; color: var(--text-muted);
  min-width: 20px; text-align: right;
}

.category-cloud { display: flex; flex-wrap: wrap; gap: 6px; }
.category-tag {
  padding: 4px 10px; border-radius: 10px;
  font-size: 0.7rem; font-weight: 500;
  background: rgba(255,255,255,0.03);
  color: var(--text-secondary);
  border: 1px solid rgba(255,255,255,0.04);
  cursor: pointer; transition: var(--transition);
}
.category-tag:hover { background: rgba(124,92,252,0.08); border-color: var(--border-medium); }
.category-tag .tg-count { color: var(--accent-cyan); font-weight: 700; margin-left: 3px; font-family: var(--font-mono); }

.sidebar-card.guide-card {
  background: rgba(124, 92, 252, 0.06);
  border-color: var(--border-medium);
}
.guide-card .guide-text { font-size: 0.73rem; line-height: 1.8; color: var(--text-secondary); }
.guide-card .guide-text span { color: var(--accent-cyan); }

/* ========== Empty State ========== */
.empty-state {
  grid-column: 1 / -1;
  text-align: center; padding: 80px 20px;
  color: var(--text-muted);
}
.empty-state .e-icon { font-size: 3rem; margin-bottom: 16px; opacity: 0.3; }
.empty-state .e-text { font-size: 1rem; margin-bottom: 6px; color: var(--text-secondary); }
.empty-state .e-hint { font-size: 0.78rem; }

/* ========== Footer ========== */
.footer {
  text-align: center; padding: 24px;
  font-size: 0.72rem; color: var(--text-muted);
  margin-top: 28px;
  font-family: var(--font-mono);
  letter-spacing: 0.5px;
}

/* ========== Loading Overlay ========== */
.loading-overlay {
  position: fixed; inset: 0;
  background: rgba(7, 11, 25, 0.85);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
  display: none; align-items: center; justify-content: center;
  z-index: 1000;
}
.loading-overlay.show { display: flex; }
.loading-ring {
  width: 42px; height: 42px;
  border: 3px solid rgba(124,92,252,0.12);
  border-top-color: var(--accent-primary);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
  box-shadow: 0 0 20px var(--accent-glow);
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ========== Toast ========== */
.toast {
  position: fixed; bottom: 28px; left: 50%;
  transform: translateX(-50%) translateY(80px);
  background: var(--bg-elevated);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border: 1px solid var(--border-medium);
  color: var(--text-primary);
  padding: 10px 22px;
  border-radius: var(--radius);
  font-size: 0.82rem; font-weight: 500;
  z-index: 2000; opacity: 0;
  transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
  box-shadow: 0 4px 24px rgba(124, 92, 252, 0.12);
}
.toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }

/* ========== Animations ========== */
@keyframes cardEnter {
  from { opacity: 0; transform: translateY(16px); }
  to { opacity: 1; transform: translateY(0); }
}
.trend-card { animation: cardEnter 0.45s ease backwards; }
.trend-card:nth-child(1) { animation-delay: 0.03s; }
.trend-card:nth-child(2) { animation-delay: 0.06s; }
.trend-card:nth-child(3) { animation-delay: 0.09s; }
.trend-card:nth-child(4) { animation-delay: 0.12s; }
.trend-card:nth-child(5) { animation-delay: 0.15s; }
.trend-card:nth-child(6) { animation-delay: 0.18s; }
.trend-card:nth-child(7) { animation-delay: 0.21s; }
.trend-card:nth-child(8) { animation-delay: 0.24s; }
.trend-card:nth-child(n+9) { animation-delay: 0.27s; }
</style>
</head>

<script>
// ========== State ==========
let allTrends = [];
let currentPlatform = 'all';
let currentCategory = 'all';
let currentEvent = 'all';
let currentSearch = '';
let currentSort = 'duoshan';

// ========== Platform Config (dark neon palette) ==========
const PLATFORM_CONFIG = {
  douyin: { name: '抖音', color: '#00f2ea', icon: '♫' },
  weibo: { name: '微博', color: '#ff4757', icon: '◈' },
  bilibili: { name: 'B站', color: '#ff6b9d', icon: '▶' },
  zhihu: { name: '知乎', color: '#4dabf7', icon: '◆' },
  baidu: { name: '百度', color: '#5c7cfa', icon: '◉' },
  toutiao: { name: '头条', color: '#ff922b', icon: '◬' },
};

const CATEGORY_ICONS = {
  '舞蹈挑战': '♫', '搞笑段子': '◉', '音乐热歌': '♪', '影视综艺': '▶',
  '科技数码': '◈', '游戏电竞': '◆', '生活日常': '●', '社会热点': '◬', '其他热点': '○',
};

// ========== Duoshan Score Calculation ==========
function calcDuoshanScore(title, category) {
  let score = 0;
  const t = title.toLowerCase();
  const catScore = {
    '舞蹈挑战': 90, '搞笑段子': 85, '音乐热歌': 80, '生活日常': 70,
    '影视综艺': 60, '游戏电竞': 55, '科技数码': 40, '社会热点': 30, '其他热点': 25,
  };
  score = catScore[category] || 25;

  const boostKeywords = ['挑战', '舞', '扭', '跳', '翻唱', '变装', '模仿', '整活', '搞笑', '段子', '鬼畜', '穿搭', '种草', '打卡', 'vlog', '教程'];
  boostKeywords.forEach(kw => { if (t.includes(kw)) score += 5; });

  const penaltyKeywords = ['通报', '政策', '事故', '声明', '调查', '回应', '公告', '法规'];
  penaltyKeywords.forEach(kw => { if (t.includes(kw)) score -= 15; });

  return Math.max(0, Math.min(100, Math.round(score)));
}

// ========== Get Duoshan Score (from data or calculate) ==========
function getDuoshanScore(trend) {
  if (typeof trend.duoshanScore === 'number') return trend.duoshanScore;
  if (typeof trend._dsScore === 'number') return trend._dsScore;
  return calcDuoshanScore(trend.title, trend.category);
}

function getScoreLevel(score) {
  if (score >= 75) return 'high';
  if (score >= 45) return 'mid';
  return 'low';
}

// ========== Init ==========
function init() {
  if (typeof TREND_DATA === 'undefined') {
    document.getElementById('trendGrid').innerHTML = `
      <div class="empty-state">
        <div class="e-icon">⊘</div>
        <div class="e-text">暂无数据</div>
        <div class="e-hint">请运行: python fetch_trends.py</div>
      </div>`;
    return;
  }

  allTrends = TREND_DATA.trends || [];
  allTrends.forEach(t => { t._dsScore = getDuoshanScore(t); });

  document.getElementById('updateDate').textContent = TREND_DATA.date || '----';
  document.getElementById('updateTime').textContent = `SYNC: ${TREND_DATA.time || '--:--:--'}`;

  if (TREND_DATA.isFallback) {
    showToast('◈ STANDBY MODE — cached sample data');
  }

  renderStats();
  renderTrends();
  renderSidebar();
}

// ========== Stats ==========
function renderStats() {
  const total = allTrends.length;
  const platforms = Object.keys(TREND_DATA.platforms || {}).length;
  const categories = [...new Set(allTrends.map(t => t.category))].length;
  const highScoreCount = allTrends.filter(t => t._dsScore >= 75).length;
  const topTrend = [...allTrends].sort((a, b) => b.hot - a.hot)[0];

  const stats = [
    { icon: '◉', value: total, label: '信号总量', extra: `${platforms} 个平台` },
    { icon: '⚡', value: topTrend ? topTrend.hotDisplay : '-', label: '峰值热度', extra: topTrend ? topTrend.title.slice(0, 12) : '' },
    { icon: '◆', value: `${highScoreCount}/${total}`, label: '多闪匹配', extra: `${categories} 个分类` },
    { icon: '▶', value: total, label: '创意灵感', extra: '每条热梗一个灵感' },
  ];

  document.getElementById('statsBar').innerHTML = stats.map(s => `
    <div class="stat-card">
      <div class="stat-icon-wrap">${s.icon}</div>
      <div class="stat-value">${s.value}</div>
      <div class="stat-label">${s.label}</div>
      <div class="stat-extra">${s.extra}</div>
    </div>
  `).join('');
}

// ========== Trends ==========
function renderTrends() {
  let filtered = allTrends.filter(t => {
    if (currentPlatform !== 'all' && t.platform !== currentPlatform) return false;
    if (currentCategory !== 'all' && t.category !== currentCategory) return false;
    if (currentEvent !== 'all') {
      const brief = t.brief || {};
      const evt = brief.event || '';
      if (currentEvent === 'KOC' && !evt.includes('KOC')) return false;
      if (currentEvent === '七夕' && !evt.includes('七夕')) return false;
      if (currentEvent === '精灵学院' && !evt.includes('精灵学院')) return false;
    }
    if (currentSearch && !t.title.toLowerCase().includes(currentSearch.toLowerCase())) return false;
    return true;
  });

  if (currentSort === 'duoshan') {
    filtered.sort((a, b) => b._dsScore - a._dsScore || b.hot - a.hot);
  } else if (currentSort === 'hot') {
    filtered.sort((a, b) => b.hot - a.hot);
  } else if (currentSort === 'rank') {
    filtered.sort((a, b) => (a.globalRank || a.rank) - (b.globalRank || b.rank));
  } else if (currentSort === 'platform') {
    filtered.sort((a, b) => {
      if (a.platform !== b.platform) return a.platform.localeCompare(b.platform);
      return b.hot - a.hot;
    });
  }

  if (filtered.length === 0) {
    document.getElementById('trendGrid').innerHTML = `
      <div class="empty-state">
        <div class="e-icon">⊘</div>
        <div class="e-text">暂无匹配数据</div>
        <div class="e-hint">尝试更换平台、分类或节点筛选</div>
      </div>`;
    return;
  }

  document.getElementById('trendGrid').innerHTML = filtered.map((t, idx) => {
    const platform = PLATFORM_CONFIG[t.platform] || { name: t.platform, color: '#666', icon: '○' };
    const score = t._dsScore;
    const scoreLevel = getScoreLevel(score);
    const rank = idx + 1;
    const rankClass = rank === 1 ? 'r1' : rank === 2 ? 'r2' : rank === 3 ? 'r3' : 'rn';
    const categoryIcon = CATEGORY_ICONS[t.category] || '○';
    const brief = t.brief || {};
    const evt = brief.event || '';
    const evtBadge = evt.includes('七夕') ? '<span class="event-badge qixi">💝 七夕</span>'
      : evt.includes('精灵学院') ? '<span class="event-badge school">🧚 精灵学院</span>'
      : evt.includes('KOC') ? '<span class="event-badge koc">📢 KOC</span>' : '';

    return `
      <div class="trend-card" style="--card-accent: ${platform.color};" onclick="toggleBrief(this, event)">
        ${t.isFallback ? '<div class="fallback-tag">缓存</div>' : ''}
        <div class="card-header">
          <div class="rank-badge ${rankClass}">${String(rank).padStart(2, '0')}</div>
          <div class="card-platform">${platform.icon} ${platform.name}</div>
          ${evtBadge}
        </div>
        <div class="card-title">${escapeHtml(t.title)}</div>
        <div class="card-meta">
          <span class="card-category">${categoryIcon} ${t.category}</span>
          ${t.hot > 0 ? `<span class="card-hot">◆ ${t.hotDisplay}</span>` : ''}
          <span class="card-score ${scoreLevel}" title="多闪匹配度">DS ${score}</span>
        </div>
        <div class="card-idea">
          <div class="idea-dot"></div>
          <span>${escapeHtml(t.idea)}</span>
        </div>
        <div class="brief-panel" style="display:none;">
          <div class="brief-row"><span class="brief-label">🧸 仔仔玩法</span>${escapeHtml(brief.zaiZaiPlay || '')}</div>
          <div class="brief-row"><span class="brief-label">🔮 技能结合</span>${escapeHtml(brief.skillBind || '')}</div>
          <div class="brief-row"><span class="brief-label">🎯 圈层切入</span>${escapeHtml(brief.circle || '')}</div>
          <div class="brief-row"><span class="brief-label">📅 节点绑定</span>${escapeHtml(evt || '')}</div>
          <div class="brief-row"><span class="brief-label">📝 内容脚本</span>${escapeHtml(brief.script || '')}</div>
          <div class="brief-row"><span class="brief-label">🏷️ 话题标签</span><span class="brief-tags">${escapeHtml(brief.tags || '')}</span></div>
        </div>
        <div class="card-expand-hint">点击展开创意简报 ▾</div>
        ${t.link ? `<a class="card-link" href="${t.link}" target="_blank" rel="noopener" onclick="event.stopPropagation()">🔍 搜索相关视频</a>` : ''}
      </div>
    `;
  }).join('');
}

// ========== Sidebar ==========
function renderSidebar() {
  // Top 5 by Duoshan score with brief info
  const top5 = [...allTrends].sort((a, b) => b._dsScore - a._dsScore || b.hot - a.hot).slice(0, 5);
  document.getElementById('topIdeas').innerHTML = top5.map((t, i) => {
    const brief = t.brief || {};
    const evtTag = (brief.event || '').includes('七夕') ? '💝七夕' : (brief.event || '').includes('精灵学院') ? '🧚精灵学院' : '';
    return `
    <div class="insight-item" onclick="copyIdea('${escapeAttr(t.idea)}')">
      <div class="ir-score">DS ${t._dsScore} · #${i + 1}${evtTag ? ' · ' + evtTag : ''}</div>
      <div class="ir-title">${escapeHtml(t.title)}</div>
      <div class="ir-desc">${escapeHtml(brief.zaiZaiPlay || t.idea)}</div>
    </div>`;
  }).join('');

  // Platform dist
  const platformCounts = {};
  allTrends.forEach(t => {
    platformCounts[t.platform] = (platformCounts[t.platform] || 0) + 1;
  });
  const maxCount = Math.max(...Object.values(platformCounts), 1);
  document.getElementById('platformDist').innerHTML = Object.entries(platformCounts).map(([key, count]) => {
    const p = PLATFORM_CONFIG[key] || { name: key, color: '#888' };
    const width = (count / maxCount * 100).toFixed(0);
    return `
      <div class="platform-bar">
        <span class="pb-label">${p.icon} ${p.name}</span>
        <div class="pb-track">
          <div class="pb-fill" style="width:${width}%;background:${p.color};"></div>
        </div>
        <span class="pb-count">${count}</span>
      </div>
    `;
  }).join('');

  // Category
  const categoryCounts = {};
  allTrends.forEach(t => {
    categoryCounts[t.category] = (categoryCounts[t.category] || 0) + 1;
  });
  const sortedCats = Object.entries(categoryCounts).sort((a, b) => b[1] - a[1]);
  document.getElementById('categoryCloud').innerHTML = sortedCats.map(([cat, count]) => {
    const icon = CATEGORY_ICONS[cat] || '○';
    return `<span class="category-tag" onclick="filterCategory('${escapeAttr(cat)}')">${icon} ${cat}<span class="tg-count">${count}</span></span>`;
  }).join('');
}

// ========== Filters ==========
function filterPlatform(platform) {
  currentPlatform = platform;
  document.querySelectorAll('[data-platform]').forEach(el => {
    el.classList.toggle('active', el.dataset.platform === platform);
  });
  renderTrends();
}

function filterCategory(category) {
  currentCategory = category;
  document.querySelectorAll('[data-category]').forEach(el => {
    el.classList.toggle('active', el.dataset.category === category);
  });
  renderTrends();
}

function filterEvent(evt) {
  currentEvent = evt;
  document.querySelectorAll('[data-event]').forEach(el => {
    el.classList.toggle('active', el.dataset.event === evt);
  });
  renderTrends();
}

function toggleBrief(card, event) {
  // Don't toggle when clicking on the link
  if (event.target.tagName === 'A') return;
  const panel = card.querySelector('.brief-panel');
  if (!panel) return;

  const isExpanded = card.classList.contains('expanded');
  // Collapse all others
  document.querySelectorAll('.trend-card.expanded').forEach(c => {
    if (c !== card) {
      c.classList.remove('expanded');
      const p = c.querySelector('.brief-panel');
      if (p) p.style.display = 'none';
    }
  });

  if (isExpanded) {
    card.classList.remove('expanded');
    panel.style.display = 'none';
  } else {
    card.classList.add('expanded');
    panel.style.display = 'block';
  }
}

function handleSearch() {
  currentSearch = document.getElementById('searchBox').value;
  renderTrends();
}

function handleSort() {
  currentSort = document.getElementById('sortSelect').value;
  renderTrends();
}

// ========== Actions ==========
function copyIdea(text) {
  navigator.clipboard.writeText(text).then(() => {
    showToast('✓ 已复制到剪贴板');
  }).catch(() => {
    showToast('✕ 复制失败');
  });
}

const ACTIONS_URL = 'https://github.com/tong-721-tong/hot-trends-workbench/actions/workflows/daily-update.yml';
const TODAY_STR = new Date().toLocaleDateString('sv-SE', { timeZone: 'Asia/Shanghai' });

function refreshData() {
  const btn = document.querySelector('.refresh-btn');
  const icon = btn.querySelector('.btn-icon');
  btn.classList.add('loading');
  icon.textContent = '⟳';

  showToast('⏳ 正在重新加载云端数据...');

  reloadDataFromFile();
}

function reloadDataFromFile() {
  const oldScript = document.querySelector('script[src^="data/data.js"]');
  const newScript = document.createElement('script');
  newScript.src = 'data/data.js?t=' + Date.now();
  newScript.onload = () => {
    const btn = document.querySelector('.refresh-btn');
    if (btn) {
      btn.classList.remove('loading');
      const icon = btn.querySelector('.btn-icon');
      if (icon) icon.textContent = '↻';
    }

    allTrends = (typeof TREND_DATA !== 'undefined' && TREND_DATA.trends) || [];
    allTrends.forEach(t => { t._dsScore = getDuoshanScore(t); });
    document.getElementById('updateDate').textContent =
      (typeof TREND_DATA !== 'undefined' && TREND_DATA.date) || '----';
    document.getElementById('updateTime').textContent =
      typeof TREND_DATA !== 'undefined'
        ? `SYNC: ${TREND_DATA.time || '--:--:--'}`
        : 'SYNC: --:--:--';
    renderStats();
    renderTrends();
    renderSidebar();

    // Check if data is fresh
    const dataDate = typeof TREND_DATA !== 'undefined' ? TREND_DATA.date : '';
    if (dataDate === TODAY_STR) {
      showToast(`✓ 数据已是今日最新 (${dataDate})`);
    } else if (dataDate) {
      showToast(`⚠ 数据为 ${dataDate} 更新，每日 9:00 自动刷新。如需立即更新请访问 GitHub Actions`);
    } else {
      showToast('⚠ 未能获取数据日期');
    }
  };
  newScript.onerror = () => {
    const btn = document.querySelector('.refresh-btn');
    if (btn) {
      btn.classList.remove('loading');
      const icon = btn.querySelector('.btn-icon');
      if (icon) icon.textContent = '↻';
    }
    showToast('✕ 数据加载失败，请检查网络');
  };
  if (oldScript) {
    oldScript.parentNode.replaceChild(newScript, oldScript);
  } else {
    document.head.appendChild(newScript);
  }
}

// ========== Utils ==========
function showToast(msg) {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 2800);
}

function escapeHtml(str) {
  if (!str) return '';
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function escapeAttr(str) {
  if (!str) return '';
  return str.replace(/'/g,"\\'").replace(/"/g,'&quot;');
}

// ========== Start ==========
init();
</script>
